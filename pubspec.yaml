name: "customertaxi"
description: "A Flutter Clean Architecture project."
publish_to: "none"
version: 1.0.5+9

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI / Design system
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  device_preview_plus: ^2.8.0
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3  
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  vector_graphics: ^1.2.2

  # State management / DI / Routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^17.3.0
  injectable: ^3.0.0
  provider: ^6.1.1

  # Networking / Session
  crypto: ^3.0.6 # SHA-256 fingerprints for TLS certificate pinning
  dio: ^5.9.0
  dio_refresh_bot: ^2.2.1
  flutter_secure_storage: ^10.3.1
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3

  # Localization / Intl
  easy_localization: ^3.0.8
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.5

  # Forms
  reactive_forms: ^18.2.0

  # Device / Permissions
  device_info_plus: ^12.4.0 # capped: syncfusion_flutter_pdfviewer requires ^12.1.0
  package_info_plus: ^9.0.1 # promoted from transitive; pinned to the already-resolved version
  permission_handler: ^12.0.3
  record: ^7.1.0 # in-trip safety audio recording
  unique_identifier: ^0.4.0
  vibration: ^3.1.5

  # Firebase
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  google_sign_in: ^6.2.2 # Google account sign-in (Firebase Google auth only)

  # Notifications & Timing
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Local Storage
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.5

  # UI Components & Input
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  pinput: ^6.0.2

  # Invoice PDF preview + share
  syncfusion_flutter_pdfviewer: ^33.2.10
  share_plus: ^12.0.2 # capped: device_info_plus ^12.x requires win32 ^5, share_plus ^13 requires win32 ^6
  file_saver: ^0.4.0
  open_filex: ^4.5.0 # open a downloaded file in an external app

  # Environment variables (Secure)
  envied: ^1.3.5

  # Maps & Location
  flutter_polyline_points: ^3.1.0
  flutter_stripe: ^13.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.1
  image_picker: ^1.1.2
  json_annotation: ^4.12.0
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.1
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_flavorizr: ^2.5.0
  freezed: ^3.2.3
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0
  objectbox_generator: ^5.3.2
  vector_graphics_compiler: ^1.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - path: assets/svgIcons/
      transformers:
        - package: vector_graphics_compiler
    - assets/icons/

flutter_gen:
  output: lib/utils/gen/

# dart run flutter_flavorizr
flavorizr:
  flavors:
    stage:
      app:
        name: "customertaxi Stage"
        package_name: "dev.fat7i.customertaxi"
      android:
        applicationId: "dev.fat7i.customertaxi"
    production:
      app:
        name: "Fat7i"
        package_name: "dev.fat7i.customertaxi"
      android:
        applicationId: "dev.fat7i.customertaxi"
  instructions:
    - android:androidManifest
    - android:flavorizrGradle
    - android:buildGradle
    - flutter:flavors
    - ide:config
